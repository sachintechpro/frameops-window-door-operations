name: FrameOps Responsive UI Regression
on:
  push:
    branches: [main]
    paths:
      - "public/index.html"
      - "public/styles.css"
      - "public/app.js"
      - "public/ops_ui.js"
      - "tests/browser_mobile_ux.py"
      - ".github/workflows/mobile-ux.yml"
  pull_request:
  workflow_dispatch:
jobs:
  responsive-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run isolated 320, 390, 768 and 1440 px browser tests
        run: python tests/browser_mobile_ux.py
      - name: Upload mobile/desktop screenshots as test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frameops-responsive-ux-evidence
          path: artifacts/mobile-ux/
          if-no-files-found: warn
