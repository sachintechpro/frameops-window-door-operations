name: FrameOps Responsive UI Regression
on:
  push:
    branches: [main]
    paths:
      - "public/index.html"
      - "public/fde-implementation.html"
      - "public/styles.css"
      - "public/field-notes.css"
      - "public/qa-bench.html"
      - "tests/browser_brand_ux.py"
      - "public/sample-data.js"
      - "tests/browser_sample_data.py"
      - "public/app.js"
      - "public/ops_ui.js"
      - "tests/browser_mobile_ux.py"
      - "tests/browser_fde_ux.py"
      - ".github/workflows/mobile-ux.yml"
  pull_request:
  workflow_dispatch:
jobs:
  responsive-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run isolated 320, 390, 768 and 1440 px browser tests
        run: python tests/browser_mobile_ux.py
      - name: Run FDE case-study responsive browser checks (320–1440 px)
        run: python tests/browser_fde_ux.py
      - name: Upload FDE responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frameops-fde-responsive-evidence
          path: artifacts/fde-ux/
          if-no-files-found: warn
      - name: Verify shared branding across operations storefront and QA
        run: python tests/browser_brand_ux.py
      - name: Check one-click test data in dynamic forms and message boxes
        run: python tests/browser_sample_data.py
      - name: Upload sample-form screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frameops-sample-form-evidence
          path: artifacts/sample-inputs/
          if-no-files-found: warn
      - name: Upload branded page responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frameops-field-notes-visual-evidence
          path: artifacts/field-notes-brand/
          if-no-files-found: warn
      - name: Upload mobile/desktop screenshots as test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frameops-responsive-ux-evidence
          path: artifacts/mobile-ux/
          if-no-files-found: warn
