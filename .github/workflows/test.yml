name: FrameOps Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run HTTP integration tests
        run: python -m unittest discover -s tests -v

      - name: Check customer-facing JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/ops_ui.js
          node --check public/storefront.js
          node --check public/catalog.js
          node --check public/demo_journey.js
          node --check public/business_settings.js

      - name: Check quote pricing, discount ceilings and customer journey rules
        run: node --test tests/checkout_rules.test.js

      - name: Check fast quote and portal JavaScript syntax
        run: node --check public/quick_checkout.js
